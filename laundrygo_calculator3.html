  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 AOS */\n  --orange-light:     #FFE5DC;   /* iOS light */\n  --orange-light-aos: #FBDFD5;   /* AOS light */\n\n  /* ── Secondary · Info Blue ── */\n  --info-blue:        #067DFD;   /* for ALL · system / info / link */\n  --info-blue-light:  #CBE8FF;   /* for ALL · light surface */\n  --system-blue:      #0068FF;   /* OS / control accent */\n\n  /* ── Semantic · Status ── */\n  --error:            #EC5F5F;   /* error / destructive */\n  --warning:          #FF4F17;   /* warning (orange) */\n  --success:          #0AC290;   /* success (green) */\n  --info:             #067DFD;   /* info (blue) */\n\n  /* ── Gray scale (neutral) ── */\n  --black:    #212121;\n  --gray-900: #212121;\n  --gray-800: #666666;\n  --gray-700: #939393;\n  --gray-600: #A1A1A1;\n  --gray-500: #C9C9C9;\n  --gray-400: #D9D9D9;\n  --gray-300: #EFEFEF;\n  --gray-200: #F5F5F5;\n  --gray-100: #FAFAFA;\n  --white:    #FFFFFF;\n\n  /* ── Cool Gray scale (tinted neutral) ── */\n  --cool-gray-800: #4C5059;\n  --cool-gray-700: #646D7A;\n  --cool-gray-600: #8F97A3;\n  --cool-gray-500: #B6BEC9;\n  --cool-gray-400: #D3D8DF;\n  --cool-gray-300: #E5E8ED;\n  --cool-gray-200: #EDF0F2;\n  --cool-gray-100: #F4F5F7;\n\n  /* ── Semantic aliases ── */\n  --color-primary:            var(--green);\n  --color-primary-pressed:    var(--green-ios);\n  --color-primary-surface:    var(--green-light);\n  --color-accent:             var(--orange);\n  --color-accent-surface:     var(--orange-light);\n  --color-link:               var(--info-blue);\n\n  --text-primary:    var(--black);\n  --text-secondary:  var(--gray-800);\n  --text-tertiary:   var(--gray-700);\n  --text-placeholder:var(--gray-500);\n  --text-disabled:   var(--gray-500);\n  --text-on-primary: var(--white);\n  --text-on-dark:    var(--white);\n  --text-link:       var(--info-blue);\n  --text-price:      var(--green);\n\n  --surface-page:    var(--white);\n  --surface-card:    var(--gray-200);\n  --surface-sunken:  var(--gray-100);\n  --surface-inverse: var(--black);\n  --surface-overlay: rgba(0, 0, 0, 0.55);\n\n  --border-default:  var(--gray-300);\n  --border-strong:   var(--gray-400);\n  --border-input:    var(--gray-400);\n  --border-focus:    var(--green);\n  --divider:         var(--gray-300);\n}\n<\u002Fstyle>\n<style>/* ── Laundrygo Design System · Typography ─────────────────────────\n   KR Pretendard · EN Basis Grotesque (→ Hanken Grotesk).\n   Scale is a recommendation; mix weights freely between Bold~Regular.\n   Never go below 12px in product UI (10px reserved for tiny badges).\n   ----------------------------------------------------------------- */\n\n:root {\n  /* ── Families ── */\n  --font-sans: \"Pretendard Variable\", Pretendard, -apple-system, BlinkMacSystemFont,\n               \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n  --font-display: \"Hanken Grotesk\", \"Basis Grotesque\", var(--font-sans);\n  --font-brand: \"Hanken Grotesk\", \"LaundryGothic\", var(--font-display);\n  --font-mono: \"Roboto Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* ── Weights ── */\n  --fw-regular: 400;   /* @kind other */\n  --fw-medium: 500;    /* @kind other */\n  --fw-semibold: 600;  /* @kind other */\n  --fw-bold: 700;      /* @kind other */\n  --fw-extrabold: 800; /* @kind other */\n\n  /* ── Type scale · size / line-height ── */\n  --fs-heading1: 32px;   --lh-heading1: 44px;   /* 타이틀1 */\n  --fs-heading2: 40px;   --lh-heading2: 52px;   /* 회원가입 타이틀 */\n  --fs-heading3: 24px;   --lh-heading3: 32px;   /* 타이틀3 */\n  --fs-heading4: 20px;   --lh-heading4: 28px;   /* 타이틀4 (basic) */\n  --fs-heading5: 18px;   --lh-heading5: 26px;   /* Appbar title · button label */\n  --fs-body1:    16px;   --lh-body1:    24px;   /* 본문 권장 */\n  --fs-body2:    14px;   --lh-body2:    22px;   /* 본문 최소 */\n  --fs-body3:    15px;   --lh-body3:    24px;   /* Label 텍스트 */\n  --fs-label:    13px;   --lh-label:    20px;   /* Label */\n  --fs-caption1: 12px;   --lh-caption1: 18px;   /* 주석 / 유의사항 */\n  --fs-caption2: 10px;   --lh-caption2: 16px;   /* Tiny badge · small button */\n}\n\n/* ── Type helper classes ── */\n.ty-heading1 { font-family: var(--font-sans); font-size: var(--fs-heading1); line-height: var(--lh-heading1); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading2 { font-family: var(--font-sans); font-size: var(--fs-heading2); line-height: var(--lh-heading2); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading3 { font-family: var(--font-sans); font-size: var(--fs-heading3); line-height: var(--lh-heading3); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading4 { font-family: var(--font-sans); font-size: var(--fs-heading4); line-height: var(--lh-heading4); font-weight: var(--fw-bold); letter-spacing: -0.01em; }\n.ty-heading5 { font-family: var(--font-sans); font-size: var(--fs-heading5); line-height: var(--lh-heading5); font-weight: var(--fw-semibold); letter-spacing: -0.01em; }\n.ty-body1    { font-family: var(--font-sans); font-size: var(--fs-body1);    line-height: var(--lh-body1);    font-weight: var(--fw-regular); }\n.ty-body2    { font-family: var(--font-sans); font-size: var(--fs-body2);    line-height: var(--lh-body2);    font-weight: var(--fw-regular); }\n.ty-body3    { font-family: var(--font-sans); font-size: var(--fs-body3);    line-height: var(--lh-body3);    font-weight: var(--fw-regular); }\n.ty-label    { font-family: var(--font-sans); font-size: var(--fs-label);    line-height: var(--lh-label);    font-weight: var(--fw-semibold); }\n.ty-caption1 { font-family: var(--font-sans); font-size: var(--fs-caption1); line-height: var(--lh-caption1); font-weight: var(--fw-regular); }\n.ty-caption2 { font-family: var(--font-sans); font-size: var(--fs-caption2); line-height: var(--lh-caption2); font-weight: var(--fw-medium); }\n.ty-display  { font-family: var(--font-display); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-num      { font-family: var(--font-mono); font-weight: var(--fw-medium); }\n<\u002Fstyle>\n<style>/* ── Laundrygo Design System · Spacing & Layout ───────────────────\n   4px base grid. Common steps observed: 8 · 10 · 16 · 20 · 24 · 32.\n   Screen side padding is 20px (mobile gutter).\n   ----------------------------------------------------------------- */\n\n:root {\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 8px;\n  --space-4: 10px;\n  --space-5: 12px;\n  --space-6: 16px;\n  --space-7: 20px;\n  --space-8: 24px;\n  --space-9: 32px;\n  --space-10: 40px;\n  --space-11: 48px;\n  --space-12: 56px;\n  --space-13: 64px;\n\n  /* layout */\n  --gutter: 20px;            /* mobile screen side padding */\n  --section-gap: 32px;       /* between home sections */\n  --content-max: 1200px;     /* web content cap */\n  --appbar-height: 56px;\n  --bottom-nav-height: 64px;\n}\n<\u002Fstyle>\n<style>/* ── Laundrygo Design System · Radius, Shadow, Effects ────────────\n   Soft, friendly geometry. Cards use 16–20px radius, no border, and\n   either a flat gray surface or a very soft ambient shadow.\n   ----------------------------------------------------------------- */\n\n:root {\n  /* ── Corner radius ── */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n  --radius-2xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* semantic radius */\n  --radius-button: 14px;\n  --radius-input: 12px;\n  --radius-card: 16px;\n  --radius-sheet: 20px;\n  --radius-badge: 6px;\n  --radius-chip: 999px;\n\n  /* ── Shadows (soft, low-contrast) ── */\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.12);\n  --shadow-card: 0 2px 12px rgba(33, 33, 33, 0.06);\n  --shadow-sheet: 0 -6px 24px rgba(0, 0, 0, 0.10);\n  --shadow-nav: 0 -2px 12px rgba(0, 0, 0, 0.05);\n\n  /* ── Motion ── */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);   /* @kind other */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);      /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);/* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-normal: 200ms; /* @kind other */\n  --dur-slow: 320ms;   /* @kind other */\n\n  /* press feedback */\n  --press-scale: 0.97; /* @kind other */\n  --press-dim: 0.92;   /* @kind other */\n\n  /* overlay / blur */\n  --scrim: rgba(0, 0, 0, 0.55);            /* @kind color */\n  --blur-bar: saturate(180%) blur(12px);   /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Generated from Figma Variables. First mode = :root default.\n   FLOAT tokens are unitless — multiply by 1px in calc() where a length is needed. */\n\n:root {\n  --cg01: rgb(244,245,247); /* @kind color */\n  --cg02-2: rgb(229,232,237); /* @kind color */\n  --cg02: rgb(229,232,237); /* @kind color */\n  --cg03-2: rgb(107,118,132); /* @kind color */\n  --cg03: rgb(100,109,122); /* @kind color */\n  --cg04-2: rgb(100,109,122); /* @kind color */\n  --cg04: rgb(76,80,89); /* @kind color */\n  --cool-gray-coolgray500: rgb(182,190,201); /* @kind color */\n  --cool-gray: rgb(244,245,247); /* @kind color */\n  --labels-primary: rgb(0,0,0); /* @kind color */\n}\n\n:root[data-theme=\"dark\"], .dark {\n  --labels-primary: rgb(255,255,255); /* @kind color */\n  --labels-primary: rgb(255,255,255); /* @kind color */\n}\n\n:root[data-theme=\"light\"], .light {\n  --labels-primary: rgb(0,0,0); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════════\n   Laundrygo Design System — global entry point.\n   Consumers link THIS file. Keep it to @import lines only.\n   ═══════════════════════════════════════════════════════════════ */\n\n/* ── Laundrygo Design System · Fonts ──────────────────────────────\n   KR primary  : Pretendard          (declared below from CDN woff2)\n   EN display  : Basis Grotesque     → substituted with Hanken Grotesk\n                 (Basis Grotesque is a comme nt-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1740c219-98be-4e9e-aa8a-dbc5f7ee26da\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ── Laundrygo Design System · Colors ─────────────────────────────\n   Color Guide v2.1.0. \"무분별한 컬러 사용을 제한\" — keep the palette tight.\n   Green is the MAIN brand colour (action / points). Blue carries the\n   '물(water)' laundry identity. Orange adds everyday wit.\n   ----------------------------------------------------------------- */\n\n:root {\n  /* ── Brand · Green (main / action) ── */\n  --green:            #0AC290;   /* for ALL · standard */\n  --green-ios:        #07926C;   /* iOS pressed / text-on-light */\n  --green-aos:        #2A8961;   /* AOS pressed */\n  --green-mid:        #51CA97;   /* AOS mid */\n  --green-light:      #CEF3E9;   /* iOS light surface */\n  --green-light-aos:  #DCF4EA;   /* AOS light surface */\n\n  /* ── Brand · Blue (water identity) ── */\n  --blue:             #189FFB;   /* standard */\n  --blue-aos:         #5EA3F3;   /* AOS */\n  --blue-light:       #CDEAFE;   /* iOS light */\n  --blue-light-aos:   #D0E4FB;   /* AOS light */\n\n  /* ── Brand · Orange (wit / accent) ── */\n  --orange:           #FF4F17;   /* standard */\n  --orange-aos:       #EC5F2F;   /* AOS */\n  --orange-light:     #FFE5DC;   /* iOS light */\n  --orange-light-aos: #FBDFD5;   /* AOS light */\n\n  /* ── Secondary · Info Blue ── */\n  --info-blue:        #067DFD;   /* for ALL · system / info / link */\n  --info-blue-light:  #CBE8FF;   /* for ALL · light surface */\n  --system-blue:      #0068FF;   /* OS / control accent */\n\n  /* ── Semantic · Status ── */\n  --error:            #EC5F5F;   /* error / destructive */\n  --warning:          #FF4F17;   /* warning (orange) */\n  --success:          #0AC290;   /* success (green) */\n  --info:             #067DFD;   /* info (blue) */\n\n  /* ── Gray scale (neutral) ── */\n  --black:    #212121;\n  --gray-900: #212121;\n  --gray-800: #666666;\n  --gray-700: #939393;\n  --gray-600: #A1A1A1;\n  --gray-500: #C9C9C9;\n  --gray-400: #D9D9D9;\n  --gray-300: #EFEFEF;\n  --gray-200: #F5F5F5;\n  --gray-100: #FAFAFA;\n  --white:    #FFFFFF;\n\n  /* ── Cool Gray scale (tinted neutral) ── */\n  --cool-gray-800: #4C5059;\n  --cool-gray-700: #646D7A;\n  --cool-gray-600: #8F97A3;\n  --cool-gray-500: #B6BEC9;\n  --cool-gray-400: #D3D8DF;\n  --cool-gray-300: #E5E8ED;\n  --cool-gray-200: #EDF0F2;\n  --cool-gray-100: #F4F5F7;\n\n  /* ── Semantic aliases ── */\n  --color-primary:            var(--green);\n  --color-primary-pressed:    var(--green-ios);\n  --color-primary-surface:    var(--green-light);\n  --color-accent:             var(--orange);\n  --color-accent-surface:     var(--orange-light);\n  --color-link:               var(--info-blue);\n\n  --text-primary:    var(--black);\n  --text-secondary:  var(--gray-800);\n  --text-tertiary:   var(--gray-700);\n  --text-placeholder:var(--gray-500);\n  --text-disabled:   var(--gray-500);\n  --text-on-primary: var(--white);\n  --text-on-dark:    var(--white);\n  --text-link:       var(--info-blue);\n  --text-price:      var(--green);\n\n  --surface-page:    var(--white);\n  --surface-card:    var(--gray-200);\n  --surface-sunken:  var(--gray-100);\n  --surface-inverse: var(--black);\n  --surface-overlay: rgba(0, 0, 0, 0.55);\n\n  --border-default:  var(--gray-300);\n  --border-strong:   var(--gray-400);\n  --border-input:    var(--gray-400);\n  --border-focus:    var(--green);\n  --divider:         var(--gray-300);\n}\n\n/* ── Laundrygo Design System · Typography ─────────────────────────\n   KR Pretendard · EN Basis Grotesque (→ Hanken Grotesk).\n   Scale is a recommendation; mix weights freely between Bold~Regular.\n   Never go below 12px in product UI (10px reserved for tiny badges).\n   ----------------------------------------------------------------- */\n\n:root {\n  /* ── Families ── */\n  --font-sans: \"Pretendard Variable\", Pretendard, -apple-system, BlinkMacSystemFont,\n               \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n  --font-display: \"Hanken Grotesk\", \"Basis Grotesque\", var(--font-sans);\n  --font-brand: \"Hanken Grotesk\", \"LaundryGothic\", var(--font-display);\n  --font-mono: \"Roboto Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* ── Weights ── */\n  --fw-regular: 400;   /* @kind other */\n  --fw-medium: 500;    /* @kind other */\n  --fw-semibold: 600;  /* @kind other */\n  --fw-bold: 700;      /* @kind other */\n  --fw-extrabold: 800; /* @kind other */\n\n  /* ── Type scale · size / line-height ── */\n  --fs-heading1: 32px;   --lh-heading1: 44px;   /* 타이틀1 */\n  --fs-heading2: 40px;   --lh-heading2: 52px;   /* 회원가입 타이틀 */\n  --fs-heading3: 24px;   --lh-heading3: 32px;   /* 타이틀3 */\n  --fs-heading4: 20px;   --lh-heading4: 28px;   /* 타이틀4 (basic) */\n  --fs-heading5: 18px;   --lh-heading5: 26px;   /* Appbar title · button label */\n  --fs-body1:    16px;   --lh-body1:    24px;   /* 본문 권장 */\n  --fs-body2:    14px;   --lh-body2:    22px;   /* 본문 최소 */\n  --fs-body3:    15px;   --lh-body3:    24px;   /* Label 텍스트 */\n  --fs-label:    13px;   --lh-label:    20px;   /* Label */\n  --fs-caption1: 12px;   --lh-caption1: 18px;   /* 주석 / 유의사항 */\n  --fs-caption2: 10px;   --lh-caption2: 16px;   /* Tiny badge · small button */\n}\n\n/* ── Type helper classes ── */\n.ty-heading1 { font-family: var(--font-sans); font-size: var(--fs-heading1); line-height: var(--lh-heading1); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading2 { font-family: var(--font-sans); font-size: var(--fs-heading2); line-height: var(--lh-heading2); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading3 { font-family: var(--font-sans); font-size: var(--fs-heading3); line-height: var(--lh-heading3); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-heading4 { font-family: var(--font-sans); font-size: var(--fs-heading4); line-height: var(--lh-heading4); font-weight: var(--fw-bold); letter-spacing: -0.01em; }\n.ty-heading5 { font-family: var(--font-sans); font-size: var(--fs-heading5); line-height: var(--lh-heading5); font-weight: var(--fw-semibold); letter-spacing: -0.01em; }\n.ty-body1    { font-family: var(--font-sans); font-size: var(--fs-body1);    line-height: var(--lh-body1);    font-weight: var(--fw-regular); }\n.ty-body2    { font-family: var(--font-sans); font-size: var(--fs-body2);    line-height: var(--lh-body2);    font-weight: var(--fw-regular); }\n.ty-body3    { font-family: var(--font-sans); font-size: var(--fs-body3);    line-height: var(--lh-body3);    font-weight: var(--fw-regular); }\n.ty-label    { font-family: var(--font-sans); font-size: var(--fs-label);    line-height: var(--lh-label);    font-weight: var(--fw-semibold); }\n.ty-caption1 { font-family: var(--font-sans); font-size: var(--fs-caption1); line-height: var(--lh-caption1); font-weight: var(--fw-regular); }\n.ty-caption2 { font-family: var(--font-sans); font-size: var(--fs-caption2); line-height: var(--lh-caption2); font-weight: var(--fw-medium); }\n.ty-display  { font-family: var(--font-display); font-weight: var(--fw-bold); letter-spacing: -0.02em; }\n.ty-num      { font-family: var(--font-mono); font-weight: var(--fw-medium); }\n\n/* ── Laundrygo Design System · Spacing & Layout ───────────────────\n   4px base grid. Common steps observed: 8 · 10 · 16 · 20 · 24 · 32.\n   Screen side padding is 20px (mobile gutter).\n   ----------------------------------------------------------------- */\n\n:root {\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 8px;\n  --space-4: 10px;\n  --space-5: 12px;\n  --space-6: 16px;\n  --space-7: 20px;\n  --space-8: 24px;\n  --space-9: 32px;\n  --space-10: 40px;\n  --space-11: 48px;\n  --space-12: 56px;\n  --space-13 ot default.\n   FLOAT tokens are unitless — multiply by 1px in calc() where a length is needed. */\n\n:root {\n  --cg01: rgb(244,245,247); /* @kind color */\n  --cg02-2: rgb(229,232,237); /* @kind color */\n  --cg02: rgb(229,232,237); /* @kind color */\n  --cg03-2: rgb(107,118,132); /* @kind color */\n  --cg03: rgb(100,109,122); /* @kind color */\n  --cg04-2: rgb(100,109,122); /* @kind color */\n  --cg04: rgb(76,80,89); /* @kind color */\n  --cool-gray-coolgray500: rgb(182,190,201); /* @kind color */\n  --cool-gray: rgb(244,245,247); /* @kind color */\n  --labels-primary: rgb(0,0,0); /* @kind color */\n}\n\n:root[data-theme=\"dark\"], .dark {\n  --labels-primary: rgb(255,255,255); /* @kind color */\n  --labels-primary: rgb(255,255,255); /* @kind color */\n}\n\n:root[data-theme=\"light\"], .light {\n  --labels-primary: rgb(0,0,0); /* @kind color */\n}\n\n<\u002Fstyle>\n<script src=\"65f3bf8c-490e-4518-92f0-fc9c7444a4fd\"><\u002Fscript>\n<style>\n@keyframes lg-fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }\n@keyframes lg-spin { to { transform:rotate(360deg); } }\n@keyframes lg-pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }\n@keyframes lg-toast { from { opacity:0; transform:translate(-50%,10px); } to { opacity:1; transform:translate(-50%,0); } }\n@keyframes lg-sheet { from { transform:translateY(100%); } to { transform:translateY(0); } }\nbody { margin:0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#EFEFEF;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;padding:24px;\">\n\n  <!-- plan option (above frame, result only) -->\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:390px;display:flex;gap:8px;margin-bottom:20px;\">\n      <button type=\"button\" onclick=\"{{ setFree }}\" style-active=\"transform:scale(0.98)\" style=\"flex:1;height:48px;               <!-- 세탁물 받는 방법 -->\n              <div style=\"padding:18px 0;border-bottom:8px solid #F4F5F7;\">\n                <div style=\"font-size:17px;font-weight:700;color:#212121;margin-bottom:14px;\">세탁물 받는 방법<\u002Fdiv>\n                <div style=\"display:flex;gap:12px;\">\n                  <button type=\"button\" onclick=\"{{ setRecvLight }}\" style=\"flex:1;border:1.5px solid {{ recvLightRing }};background:#fff;border-radius:14px;padding:14px 10px 12px;cursor:pointer;font-family:inherit;position:relative;\">\n                    <div style=\"position:absolute;top:12px;left:12px;\">{{ recvLightRadio }}<\u002Fdiv>\n                    <div style=\"height:60px;display:flex;align-items:center;justify-content:center;margin:6px 0 8px;\">\n                      <div style=\"width:46px;height:56px;background:#EDF0F3;border:1.5px solid #CBD3DC;border-radius:8px 8px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#9AA6B2;text-align:center;line-height:12px;\">런드리<br>백<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:14px;font-weight:700;color:#212121;text-align:center;\">라이트백<\u002Fdiv>\n                  <\u002Fbutton>\n                  <button type=\"button\" onclick=\"{{ setRecvLaundret }}\" style=\"flex:1;border:1.5px solid {{ recvLaundretRing }};background:#fff;border-radius:14px;padding:14px 10px 12px;cursor:pointer;font-family:inherit;position:relative;\">\n                    <div style=\"position:absolute;top:12px;left:12px;\">{{ recvLaundretRadio }}<\u002Fdiv>\n                    <div style=\"height:60px;display:flex;align-items:center;justify-content:center;margin:6px 0 8px;\">\n                      <div style=\"width:40px;height:56px;background:#4C5059;border-radius:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:8px;font-weight:700;color:#fff;\">LaundryGo<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:14px;font-weight:700;color:#212121;text-align:center;\">런드렛<\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <button type=\"button\" onclick=\"{{ noop }}\" style=\"width:100%;margin-top:12px;background:#F5F5F5;border:none;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:inherit;text-align:left;\">\n                  <div><div style=\"font-size:14px;font-weight:700;color:#212121;\">런드렛 구성품 요청<\u002Fdiv><div style=\"font-size:12.5px;color:#939393;margin-top:2px;\">생활빨래망, 속옷망을 요청해보세요<\u002Fdiv><\u002Fdiv>\n                  <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M9 6l6 6-6 6\" stroke=\"#C9C9C9\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <div style=\"font-size:12px;color:#939393;margin-top:10px;line-height:17px;\">· 라이트백/런드렛은 무료로 이용하실 수 있어요.<br>· 서비스 없이 반납만 신청하면 방문 수거 비용 3,800원이 발생해요.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- 배송 정보 -->\n              <div style=\"padding:18px 0;border-bottom:8px solid #F4F5F7;\">\n                <div style=\"font-size:17px;font-weight:700;color:#212121;margin-bottom:14px;\">배송 정보<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;\">\n                  <div style=\"flex:1;\"><div style=\"font-size:13px;color:#939393;font-weight:600;\">주소<\u002Fdiv><div style=\"font-size:14px;color:#212121;margin-top:5px;line-height:20px;\">용산구 세탁로 1701, 런드리고 10층 1005호<br>공동현관 비밀번호: 종 #1234 종<\u002Fdiv><div style=\"font-size:12.5px;color:#0AC290;margin-top:5px;font-weight:600;\">심야 세대호출 동의<\u002Fdiv><\u002Fdiv>\n                  <button type=\"button\" onclick=\"{{ noop }}\" style=\"border:1px solid #D9D9D9;background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;color:#212121;cursor:pointer;font-family:inherit;margin-left:10px;\">변경<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"height:1px;background:#F2F2F2;margin:16px 0;\"><\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;\">\n                  <div style=\"flex:1;\"><div style=\"font-size:13px;color:#939393;font-weight:600;\">배송 요청사항<\u002Fdiv><div style=\"font-size:14px;color:#212121;margin-top:5px;line-height:20px;\">수거/배송 알림: 오전 7시 이후<\u002Fdiv><\u002Fdiv>\n                  <button type=\"button\" onclick=\"{{ noop }}\" style=\"border:1px solid #D9D9D9;background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;color:#212121;cursor:pointer;font-family:inherit;margin-left:10px;\">변경<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- 배송 방법 -->\n              <div style=\"padding:18px 0;border-bottom:8px solid #F4F5F7;\">\n                <div style=\"font-size:17px;font-weight:700;color:#212121;margin-bottom:14px;\">배송 방법<\u002Fdiv>\n                <button type=\"button\" onclick=\"{{ setDelNight }}\" style=\"width:100%;border:1.5px solid {{ delNightRing }};background:#fff;border-radius:14px;padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:inherit;text-align:left;margin-bottom:10px;\">\n                  {{ delNightRadio }}\n                  <div style=\"flex:1;\"><div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"font-size:15px;font-weight:700;color:#212121;\">한밤배송<\u002Fspan><span style=\"font-size:11px;font-weight:800;color:#0AC290;font-style:italic;\">Express<\u002Fspan><\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:3px;\">12/6(금) 아침 7시까지 도착<\u002Fdiv><\u002Fdiv>\n                <\u002Fbutton>\n                <button type=\"button\" onclick=\"{{ setDelMulti }}\" style=\"width:100%;border:1.5px solid {{ delMultiRing }};background:#fff;border-radius:14px;padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:inherit;text-align:left;\">\n                  {{ delMultiRadio }}\n                  <div style=\"flex:1;\"><div style=\"font-size:15px;font-weight:700;color:#212121;\">여러밤배송<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:3px;\">12/8(금) 아침 7시까지 도착<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:13px;font-weight:800;color:#FF4F17;white-space:nowrap;\">1,000P 혜택 지급<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n\n              <!-- 개별클리닝 추가케어 -->\n              <sc-if value=\"{{ svcClean }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:18px 0;border-bottom:8px solid #F4F5F7;\">\n                  <div style=\"font-size:17px;font-weight:700;color:#212121;margin-bottom:12px;\">개별클리닝 추가케어<span style=\"color:#FF4F17;\">*<\u002Fspan><\u002Fdiv>\n                  <div style=\"border:1px solid #EFEFEF;border-radius:14px;padding:16px;\">\n                    <div style=\"font-size:13.5px;color:#4C5059;line-height:20px;\">약속된 기한 내 최대한의 케어를 진행하지만,<br>얼룩이 심한 경우 작업에 1~2일 더 소요될 수 있어요.<\u002Fdiv>\n                    <div style=\"display:flex;gap:10px;margin-top:16px;\">\n                      <button type=\"button\" onclick=\"{{ setCareOn }}\" style=\"flex:1;border:1.5px solid {{ careOnRing }};background:#fff;border-radius:12px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;\">{{ careOnRadio }}<span style=\"font-size:14px;font-weight:600;color:#212121;\">추가케어 진행<\u002Fspan><\u002Fbutton>\n                      <button type=\"button\" onclick=\"{{ setCareKeep }}\" style=\"flex:1;border:1.5px solid {{ careKeepRing }};background:#fff;border-radius:12px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;\">{{ careKeepRadio }}<span style=\"font-size:14px;font-weight:600;color:#212121;\">배송일 유지<\u002Fspan><\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:#939393;margin-top:10px;\">· 배송지연 시 한밤배송 비용은 청구되지 않아요.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- 결제수단 -->\n              <div style=\"padding:18px 0;\">\n                <div style=\"font-size:17px;font-weight:700;color:#212121;margin-bottom:14px;\">결제수단<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                  <span style=\"font-size:15px;font-weight:600;color:#212121;\">신한카드 •••• •••• •••• •073<\u002Fspan>\n                  <button type=\"button\" onclick=\"{{ noop }}\" style=\"border:1px solid #D9D9D9;background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;color:#212121;cursor:pointer;font-family:inherit;\">변경<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:#939393;margin-top:12px;line-height:18px;\">· 카드 유효성 확인을 위해, 100원 가결제 후 즉시 취소됩니다.<br>· 선택한 대표 결제수단으로 결제금액이 자동 결제됩니다.<\u002Fdiv>\n                <button type=\"button\" onclick=\"{{ noop }}\" style=\"width:100%;margin-top:14px;background:#F5F5F5;border:none;border-radius:12px;padding:15px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;\">\n                  <span style=\"font-size:13px;font-weight:800;color:#0064FF;\">pay<\u002Fspan>\n                  <span style=\"font-size:14px;font-weight:600;color:#212121;\">토스페이 첫 결제 이벤트<\u002Fspan>\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"margin-left:auto;\"><path d=\"M9 6l6 6-6 6\" stroke=\"#C9C9C9\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"background:#F4F5F7;border-radius:12px;padding:14px 16px;\">\n                <div style=\"font-size:11.5px;color:#939393;line-height:18px;\">· 런드리고는 세탁물 배송 완료 후 이용금액이 결제되는 후불 결제방식입니다.<br>· 한 번 이용/자유이용의 경우 대표 결제수단으로 자동 결제됩니다.<br>· 수거신청이 완료되면 늦어도 22시 전까지 수거신청 정보를 수정하거나 취소할 수 있어요.<br>· 검수 단계에서 전문가의 의견에 따라 서비스가 진행되지 않을 수 있어요.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:12px 20px;background:#fff;flex-shrink:0;border-top:1px solid #F2F2F2;\">\n              <button type=\"button\" onclick=\"{{ toggleAgree }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-family:inherit;padding:0;margin-bottom:12px;\">\n                {{ agreeCheck }}\n                <span style=\"font-size:13.5px;color:#4C5059;font-weight:600;\">세탁 및 수선 고지사항에 동의<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#939393;text-decoration:underline;text-underline-offset:2px;margin-left:2px;\">확인하기<\u002Fspan>\n              <\u002Fbutton>\n              <button type=\"button\" onclick=\"{{ submitRequest }}\" disabled=\"{{ noAgree }}\" style-active=\"transform:scale(0.97)\" style=\"width:100%;height:56px;border:none;outline:none;border-radius:14px;background:#0AC290;color:#fff;font-size:18px;font-weight:600;font-family:inherit;letter-spacing:-0.01em;cursor:pointer;opacity:{{ agreeOpacity }};transition:transform .12s ease-out;-webkit-tap-highlight-color:transparent;\">수거신청 하기<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- coupon bottom sheet -->\n    <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:30;\">\n        <div onclick=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(0,0,0,0.55);animation:lg-fade .2s ease-out;\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:14px 20px 24px;animation:lg-sheet .28s eas Care === \"keep\" ? \"#0AC290\" : \"#EFEFEF\",\n      careOnRadio: radioDot(s.addCare === \"care\"), careKeepRadio: radioDot(s.addCare === \"keep\"),\n\n      toggleTowelReturn: () => this.setState({ towelReturn: !s.towelReturn }),\n      towelRetRing: s.towelReturn ? \"#0AC290\" : \"#EFEFEF\", towelRetBg: s.towelReturn ? \"#F7FCFA\" : \"#fff\",\n      towelRetCheck: checkBox(s.towelReturn),\n\n      togglePointFirst: () => this.setState({ pointFirst: !s.pointFirst }),\n      pointTrackBg: s.pointFirst ? \"#0AC290\" : \"#D9D9D9\", pointKnobLeft: s.pointFirst ? \"23px\" : \"3px\",\n\n      toggleAgree: () => this.setState({ agree: !s.agree }),\n      agreeCheck: checkBox(s.agree), noAgree: !s.agree, agreeOpacity: s.agree ? 1 : 0.4,\n      submitRequest: () => { if (s.agree) this.showToast(\"수거신청이 완료되었어요!\"); },\n\n      // ── history sheet ──\n      openHistory: () => this.setState({ historyOpen: true }),\n      historyOpen: s.historyOpen, closeHistory: () => this.setState({ historyOpen: false }),\n      historyItems: historyData.map((h) => ({\n        label: h.label, date: h.date, count: h.photos.length,\n        thumbs: histThumb(h.photos.length), onLoad: () => this.loadHistory(h.photos),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
