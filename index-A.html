<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>런드리고 비즈니스 A</title>
<style>
  html, body { margin:0; padding:0; background:#f6f7f9; min-height:100dvh; }
  body { -webkit-text-size-adjust:100%; }
  @media (max-width:480px){ html,body{ background:#fff; } }
</style>
</head>
<body>
<div id="lg-root"></div>

<style>
  /* ===== 런드리고 디자인 토큰 (피그마 DS 연동 시 이 값만 교체) ===== */
  #lg-root {
    /* 일반 런드리고 = 시그니처 그린 */
    --lg-green: #00c389;
    --lg-green-d: #00a876;
    --lg-green-soft: #e7f8f1;
    /* 비즈니스 = 구분되는 딥 네이비/블루 */
    --lg-navy: #1a2b4a;
    --lg-navy-2: #24355a;
    --lg-blue: #2f6bff;
    --lg-blue-soft: #eaf0ff;
    --lg-ink: #1a1a1a;
    --lg-gray-1: #6b7280;
    --lg-gray-2: #a3a8b0;
    --lg-line: #f0f0f2;
    --lg-line-2: #e8e8eb;
    --lg-bg: #ffffff;
    --lg-bg-2: #f7f8f9;
    --lg-card: #ffffff;
    --lg-cream: #f5f5f0;
    --lg-success: #00c389;
    --lg-warn: #e8852b;
    --lg-radius: 18px;
    --lg-radius-sm: 12px;
    --lg-shadow: 0 4px 16px rgba(0,0,0,.05);
    --lg-shadow-lg: 0 18px 48px rgba(20,24,31,.18);

    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--lg-ink);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #lg-root * { box-sizing: border-box; margin: 0; padding: 0; }

  /* phone frame */
  #lg-root .lg-phone {
    width: 390px;
    max-width: 100%;
    height: 800px;
    background: var(--lg-bg);
    border-radius: 44px;
    box-shadow: var(--lg-shadow-lg);
    border: 1px solid #e3e4e8;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #lg-root .lg-notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 150px; height: 26px; background: #000; border-radius: 0 0 18px 18px; z-index: 60;
  }

  /* 모바일: 풀스크린 (베젤·노치·고정높이 제거) */
  @media (max-width: 480px) {
    #lg-root { padding: 0; min-height: 100dvh; }
    #lg-root .lg-phone {
      width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none;
    }
    #lg-root .lg-notch { display: none; }
    #lg-root .lg-statusbar { display: none; }
  }
  #lg-root .lg-statusbar {
    height: 44px; flex: 0 0 44px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 4px; font-size: 13px; font-weight: 600; color: var(--lg-ink); z-index: 40;
  }
  #lg-root .lg-statusbar.dark { color: #fff; }

  /* screen container */
  #lg-root .lg-screen {
    flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch;
  }
  #lg-root .lg-screen::-webkit-scrollbar { width: 0; }

  /* nav bar (webview) */
  #lg-root .lg-webnav {
    height: 52px; display: flex; align-items: center; padding: 0 14px; gap: 8px;
    background: var(--lg-card); border-bottom: 1px solid var(--lg-line); position: sticky; top: 0; z-index: 30;
  }
  #lg-root .lg-webnav .x {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: #f0f1f3; cursor: pointer;
    font-size: 17px; color: var(--lg-ink); display: flex; align-items: center; justify-content: center;
  }
  #lg-root .lg-webnav .ttl { font-size: 15px; font-weight: 700; }
  #lg-root .lg-webnav .lock { margin-left: auto; font-size: 11px; color: var(--lg-gray-2); }

  /* ===== APP HOME (MY tab) ===== */
  #lg-root .app-topbar {
    padding: 18px 20px 12px; display: flex; align-items: center; justify-content: space-between;
    background: var(--lg-bg-2);
  }
  #lg-root .app-topbar h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
  #lg-root .app-prof { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,var(--lg-green),var(--lg-green-d)); }

  #lg-root .my-card {
    margin: 8px 16px; background: var(--lg-card); border:1px solid var(--lg-line-2);
    border-radius: var(--lg-radius); padding: 20px; position: relative; overflow: hidden; box-shadow:var(--lg-shadow);
  }
  #lg-root .my-card .name { font-size: 17px; font-weight: 800; }
  #lg-root .my-card .sub { font-size: 12px; color: var(--lg-green-d); font-weight:700; margin-top: 4px; }
  #lg-root .my-card .pts { margin-top: 16px; display: flex; }
  #lg-root .my-card .pts > div { flex:1; text-align:center; }
  #lg-root .my-card .pts b { display:block; font-size: 18px; font-weight: 800; color:var(--lg-ink); }
  #lg-root .my-card .pts span { font-size: 11px; color: var(--lg-gray-1); }

  #lg-root .my-list { margin: 8px 16px 16px; background: var(--lg-card); border-radius: var(--lg-radius); overflow:hidden; }
  #lg-root .my-row {
    display: flex; align-items: center; gap: 13px; padding: 16px 18px; cursor: pointer;
    border-bottom: 1px solid var(--lg-line); background: var(--lg-card); transition: background .15s;
  }
  #lg-root .my-row:last-child { border-bottom: none; }
  #lg-root .my-row:active { background: #f7f8fa; }
  #lg-root .my-row .ico {
    width: 40px; height: 40px; border-radius: 11px; display:flex; align-items:center; justify-content:center;
    font-size: 19px; flex:0 0 40px;
  }
  #lg-root .my-row .lab { font-size: 15px; font-weight: 600; }
  #lg-root .my-row .desc { font-size: 12px; color: var(--lg-gray-1); margin-top: 2px; }
  #lg-root .my-row .arr { margin-left: auto; color: var(--lg-gray-2); font-size: 18px; }

  /* highlight business entry */
  #lg-root .my-row.biz {
    background: linear-gradient(100deg, #fbfcff, #f2f6ff);
  }
  #lg-root .my-row.biz .ico { background: var(--lg-navy); color: #fff; }
  #lg-root .my-row.biz .badge {
    margin-left: 8px; font-size: 10px; font-weight: 800; color: #fff; background: var(--lg-blue);
    padding: 2px 7px; border-radius: 20px; letter-spacing: .3px;
  }

  /* bottom GNB */
  #lg-root .gnb {
    flex: 0 0 64px; display: flex; background: var(--lg-card); border-top: 1px solid var(--lg-line);
  }
  #lg-root .gnb button {
    flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; font-size:10.5px; color:var(--lg-gray-2); font-weight:600;
  }
  #lg-root .gnb button .gi { font-size: 20px; }
  #lg-root .gnb button.on { color: var(--lg-green-d); }

  /* ===== REAL LAUNDRYGO HOME ===== */
  #lg-root .lgh-header {
    padding: 14px 20px 10px; display:flex; align-items:flex-start; justify-content:space-between;
    background: var(--lg-card);
  }
  #lg-root .lgh-header .htxt { font-size:17px; font-weight:800; line-height:1.4; letter-spacing:-.3px; }
  #lg-root .lgh-days { display:flex; align-items:center; gap:5px; margin-top:7px; }
  #lg-root .lgh-days .dnum {
    width:24px; height:30px; background:var(--lg-ink); color:#fff; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800;
  }
  #lg-root .lgh-days .dsuf { font-size:14px; font-weight:700; margin-left:3px; }
  #lg-root .lgh-lock {
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--lg-green);
    display:flex; align-items:center; justify-content:center; color:var(--lg-green); font-size:16px;
  }

  /* mode switcher A: segmented toggle */
  #lg-root .mode-seg {
    margin:8px 16px 4px; background:var(--lg-bg-2); border-radius:13px; padding:4px; display:flex; gap:4px;
  }
  #lg-root .mode-seg button {
    flex:1; height:40px; border:none; border-radius:10px; background:transparent; cursor:pointer;
    font-size:13.5px; font-weight:800; color:var(--lg-gray-1); font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:6px; transition:.18s;
  }
  #lg-root .mode-seg button.on { background:var(--lg-card); color:var(--lg-ink); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #lg-root .mode-seg button.on.biz { color:var(--lg-navy); }
  #lg-root .mode-seg button .md { width:7px; height:7px; border-radius:50%; }
  #lg-root .mode-seg button.on .md.g { background:var(--lg-green); }
  #lg-root .mode-seg button.on .md.b { background:var(--lg-blue); }

  /* mode switcher B: dropdown chip (top-left) */
  #lg-root .lgh-switch {
    display:inline-flex; align-items:center; gap:7px; background:var(--lg-bg-2);
    border-radius:20px; padding:6px 12px 6px 8px; margin-bottom:8px; cursor:pointer;
  }
  #lg-root .lgh-switch .av {
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#fff;
  }
  #lg-root .lgh-switch .av.g { background:var(--lg-green); }
  #lg-root .lgh-switch .av.b { background:var(--lg-navy); }
  #lg-root .lgh-switch .sl { font-size:13px; font-weight:800; }
  #lg-root .lgh-switch .ca { font-size:11px; color:var(--lg-gray-2); }

  /* hero card (오늘 바로 세탁해요) */
  #lg-root .lgh-hero {
    margin:10px 16px; background:var(--lg-card); border:1px solid var(--lg-line-2); border-radius:var(--lg-radius);
    padding:24px 22px; box-shadow:var(--lg-shadow);
  }
  #lg-root .lgh-hero h3 { font-size:20px; font-weight:800; line-height:1.4; letter-spacing:-.4px; }
  #lg-root .lgh-hero .basket {
    height:130px; margin:14px 0; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:64px; background:linear-gradient(160deg,#f3f5f6,#e9edef);
  }
  #lg-root .lgh-hero .meta { display:flex; padding:6px 0 16px; }
  #lg-root .lgh-hero .meta > div { flex:1; text-align:center; }
  #lg-root .lgh-hero .meta .ml { font-size:12px; color:var(--lg-gray-1); }
  #lg-root .lgh-hero .meta .mv { font-size:15px; font-weight:800; margin-top:4px; }
  #lg-root .lgh-hero .meta .div { flex:0; border-left:1px solid var(--lg-line-2); }
  #lg-root .lgh-cta-main {
    width:100%; height:54px; border:none; border-radius:13px; color:#fff; font-size:16px; font-weight:800;
    cursor:pointer; font-family:inherit; background:var(--lg-green);
  }
  #lg-root .lgh-cta-main.biz { background:var(--lg-navy); }

  /* quick 4 icons */
  #lg-root .lgh-quick {
    margin:8px 16px; background:var(--lg-card); border:1px solid var(--lg-line-2); border-radius:var(--lg-radius);
    padding:20px 10px; display:flex; box-shadow:var(--lg-shadow);
  }
  #lg-root .lgh-quick > div { flex:1; text-align:center; cursor:pointer; }
  #lg-root .lgh-quick .qi {
    width:46px; height:46px; border-radius:50%; background:var(--lg-ink); margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
  }
  #lg-root .lgh-quick .qln { font-size:12px; font-weight:700; }

  /* service grid (런드리고 서비스) */
  #lg-root .lgh-svc {
    margin:8px 16px; background:var(--lg-card); border:1px solid var(--lg-line-2); border-radius:var(--lg-radius);
    padding:18px 18px 20px; box-shadow:var(--lg-shadow);
  }
  #lg-root .lgh-svc .st { font-size:15px; font-weight:800; }
  #lg-root .lgh-svc .ss { font-size:12px; color:var(--lg-gray-1); margin-top:3px; }
  #lg-root .lgh-svc .sgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px 8px; margin-top:16px; }
  #lg-root .lgh-svc .sitem { text-align:center; }
  #lg-root .lgh-svc .sic {
    width:48px; height:48px; border-radius:14px; background:var(--lg-bg-2); margin:0 auto 7px;
    display:flex; align-items:center; justify-content:center; font-size:23px;
  }
  #lg-root .lgh-svc .sln { font-size:11.5px; font-weight:600; }

  /* biz entry promo banner (가입 전 발견 동선) */
  #lg-root .biz-promo {
    margin:8px 16px; border-radius:var(--lg-radius); overflow:hidden; cursor:pointer;
    background:linear-gradient(110deg, var(--lg-navy), #16243f); color:#fff; padding:20px 20px;
    position:relative;
  }
  #lg-root .biz-promo::after {
    content:''; position:absolute; right:-20px; bottom:-30px; width:120px; height:120px;
    background:radial-gradient(circle, rgba(47,107,255,.4), transparent 65%); border-radius:50%;
  }
  #lg-root .biz-promo .bp-tag { font-size:10.5px; font-weight:800; color:#9fc0ff; letter-spacing:.4px; }
  #lg-root .biz-promo .bp-t { font-size:17px; font-weight:800; margin-top:6px; line-height:1.4; position:relative; }
  #lg-root .biz-promo .bp-d { font-size:12px; color:#bcc7dd; margin-top:8px; position:relative; }
  #lg-root .biz-promo .bp-go {
    margin-top:14px; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800;
    background:rgba(255,255,255,.14); padding:8px 14px; border-radius:20px; position:relative;
  }

  /* biz mode home banner (전환 후) */
  #lg-root .biz-mode-card {
    margin:10px 16px; background:linear-gradient(135deg, var(--lg-navy), #16243f); border-radius:var(--lg-radius);
    padding:20px; color:#fff; position:relative; overflow:hidden;
  }
  #lg-root .biz-mode-card::after {
    content:''; position:absolute; right:-30px; top:-30px; width:130px; height:130px;
    background:radial-gradient(circle, rgba(47,107,255,.4), transparent 70%); border-radius:50%;
  }
  #lg-root .biz-mode-card .bn { font-size:12px; color:#9fb0d0; position:relative; }
  #lg-root .biz-mode-card .bb { font-size:18px; font-weight:800; margin-top:3px; display:flex; align-items:center; gap:8px; position:relative; }
  #lg-root .biz-mode-card .plan-chip { font-size:10px; font-weight:800; background:var(--lg-blue); padding:3px 9px; border-radius:20px; }
  #lg-root .biz-mode-card .nextd {
    margin-top:16px; background:rgba(255,255,255,.1); border-radius:13px; padding:14px; display:flex; align-items:center; gap:12px; position:relative;
  }
  #lg-root .biz-mode-card .nextd .ne { font-size:24px; }
  #lg-root .biz-mode-card .nextd .nl { font-size:11px; color:#9fb0d0; }
  #lg-root .biz-mode-card .nextd .nv { font-size:14px; font-weight:800; margin-top:2px; }
  #lg-root .biz-mode-card .biz-meta {
    display:flex; gap:10px; margin-top:14px; position:relative;
  }
  #lg-root .biz-mode-card .biz-meta > div {
    flex:1; background:rgba(255,255,255,.1); border-radius:11px; padding:11px 13px;
  }
  #lg-root .biz-mode-card .biz-meta .bml { display:block; font-size:10.5px; color:#9fb0d0; }
  #lg-root .biz-mode-card .biz-meta .bmv { display:block; font-size:14px; font-weight:800; margin-top:3px; }
  #lg-root .biz-mode-card .biz-order-btn {
    width:100%; height:48px; margin-top:14px; border:none; border-radius:12px; cursor:pointer;
    background:var(--lg-blue); color:#fff; font-size:14.5px; font-weight:800; font-family:inherit; position:relative;
  }
  #lg-root .biz-mode-card .biz-order-btn:active { transform:scale(.99); }

  /* B안: 계정 전환 바텀시트 */
  #lg-root .sheet-dim {
    position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:80; display:flex; align-items:flex-end;
    animation: fade .2s ease;
  }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  #lg-root .sheet {
    width:100%; background:var(--lg-card); border-radius:22px 22px 0 0; padding:10px 16px calc(20px + env(safe-area-inset-bottom));
    animation: rise .26s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rise { from{transform:translateY(100%)} to{transform:translateY(0)} }
  #lg-root .sheet .grab { width:38px; height:4px; background:var(--lg-line-2); border-radius:4px; margin:6px auto 14px; }
  #lg-root .sheet .sh-t { font-size:15px; font-weight:800; padding:0 4px 8px; }
  #lg-root .sheet .acc {
    display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:14px; cursor:pointer; border:1.5px solid transparent;
  }
  #lg-root .sheet .acc.on { border-color:var(--lg-line-2); background:var(--lg-bg-2); }
  #lg-root .sheet .acc .av2 {
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff; flex:0 0 42px;
  }
  #lg-root .sheet .acc .av2.g { background:var(--lg-green); }
  #lg-root .sheet .acc .av2.b { background:var(--lg-navy); }
  #lg-root .sheet .acc .an { font-size:14.5px; font-weight:800; }
  #lg-root .sheet .acc .ad { font-size:11.5px; color:var(--lg-gray-1); margin-top:2px; }
  #lg-root .sheet .acc .chk { margin-left:auto; color:var(--lg-green-d); font-size:18px; font-weight:800; }

  /* ===== 사업장 수거신청 플로우 ===== */
  #lg-root .ord-head {
    display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--lg-card);
    border-bottom:1px solid var(--lg-line); position:sticky; top:0; z-index:20;
  }
  #lg-root .ord-head .bk {
    width:32px; height:32px; border:none; background:none; font-size:20px; cursor:pointer; color:var(--lg-ink);
  }
  #lg-root .ord-head .ot { font-size:16px; font-weight:800; }
  #lg-root .ord-wrap { padding:18px 16px 16px; }
  #lg-root .ord-q { font-size:20px; font-weight:800; letter-spacing:-.4px; line-height:1.4; }
  #lg-root .ord-tabs { display:flex; gap:14px; margin:14px 0 4px; }
  #lg-root .ord-tabs span { font-size:13px; font-weight:700; color:var(--lg-gray-2); }
  #lg-root .ord-tabs span.on { color:var(--lg-ink); }

  /* service select card */
  #lg-root .svc-card {
    background:var(--lg-card); border:1px solid var(--lg-line-2); border-radius:16px; padding:18px;
    margin-top:12px; cursor:pointer; transition:.15s; position:relative;
  }
  #lg-root .svc-card:active { background:#fafbfc; }
  #lg-root .svc-card .sc-top { display:flex; align-items:center; gap:13px; }
  #lg-root .svc-card .sc-ic {
    width:54px; height:54px; border-radius:14px; background:var(--lg-bg-2);
    display:flex; align-items:center; justify-content:center; font-size:26px; flex:0 0 54px;
  }
  #lg-root .svc-card .sc-t { font-size:16px; font-weight:800; display:flex; align-items:center; gap:7px; }
  #lg-root .svc-card .sc-d { font-size:12.5px; color:var(--lg-gray-1); margin-top:4px; }
  #lg-root .svc-card .sc-plus {
    margin-left:auto; width:26px; height:26px; border-radius:50%; background:var(--lg-navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 26px;
  }
  #lg-root .svc-card .sc-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
  #lg-root .svc-card .sc-tag {
    font-size:11.5px; font-weight:600; color:var(--lg-gray-1); background:var(--lg-bg-2);
    padding:5px 10px; border-radius:7px;
  }
  #lg-root .svc-card .sc-badge {
    font-size:10px; font-weight:800; color:#fff; padding:2px 7px; border-radius:6px;
  }
  #lg-root .sc-badge.rent { background:var(--lg-blue); }
  #lg-root .sc-badge.wash { background:var(--lg-warn); }

  /* product detail */
  #lg-root .pd-hero {
    height:200px; background:linear-gradient(160deg,#eef2fb,#dfe6f4); display:flex; align-items:center; justify-content:center;
    font-size:72px;
  }
  #lg-root .pd-body { padding:20px 18px; }
  #lg-root .pd-t { font-size:19px; font-weight:800; }
  #lg-root .pd-sub { font-size:13px; color:var(--lg-gray-1); margin-top:7px; line-height:1.55; }
  #lg-root .pd-item {
    display:flex; align-items:center; gap:12px; padding:16px 0; border-top:1px solid var(--lg-line);
  }
  #lg-root .pd-item:first-of-type { margin-top:8px; }
  #lg-root .pd-item .pin { font-size:14.5px; font-weight:700; }

        ${cards}
        <div class="hint-flow" style="padding:16px 8px 8px">여러 서비스를 담아 한 번에 신청할 수 있어요</div>
      </div>
      ${bar}
    </div>`;
  }

  // STEP B — 상품 상세 (호텔타월 홈서비스 구조 차용)
  function orderDetail(){
    const s = svcList()[S.orderItem];
    let rows='';
    s.items.forEach((it,i)=>{
      const q = cartQty(S.orderItem, i);
      rows += `<div class="pd-item">
        <div style="flex:1">
          <div class="pin">${it.n}</div>
          <div class="pip">${it.p}</div>
          <div class="pprice">${won(it.price)}원${s.type==='wash'?' / 점':' / 회전'}</div>
        </div>
        <div class="stepper">
          <button data-oqty="${i}|-1">−</button>
          <span class="qv">${q}</span>
          <button data-oqty="${i}|1">＋</button>
        </div>
      </div>`;
    });
    const svcQ = S.cart[S.orderItem] ? Object.values(S.cart[S.orderItem]).reduce((a,b)=>a+b,0) : 0;
    const notice = s.type==='wash'
      ? ['수거 후 South/East 팩토리에서 세탁 공정을 거칩니다 (2~3일 소요).','세탁 완료 품목은 다음 렌탈 배송 시 합포장으로 출고됩니다.','운영 연속성에 영향이 없도록 렌탈 품목과 분리해 처리합니다.']
      : ['사용한 렌탈 품목은 다음 수거신청 시 반납해 주세요.','모든 렌탈 품목에 RFID가 부착되어 입·출고가 자동 기록됩니다.','분실·심한 손상 시 품목별 보증금이 별도 과금될 수 있습니다.'];
    const cnt = cartCount();
    return `
    ${statusBar(false)}
    <div class="lg-screen" style="background:var(--lg-card)">
      <div class="ord-head">
        <button class="bk" data-go="order_select">‹</button>
        <span class="ot">${s.name}</span>
      </div>
      <div class="pd-hero">${s.emoji}</div>
      <div class="pd-body">
        <div class="pd-t">${s.name}</div>
        <div class="pd-sub">${SEG[S.seg].label} 사업장 권장 구성입니다. 필요한 수량만큼 담아주세요.${s.type==='wash'?' 세탁 품목은 2~3일 리드타임이 있어요.':''}</div>
        ${rows}
        <div class="pd-notice">
          <div class="pnt">안내사항</div>
          <ul>${notice.map(n=>`<li>${n}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    <div class="cta-bar" style="display:flex;gap:10px">
      <button class="btn ghost" data-go="order_select" style="flex:1">${cnt>0?`목록 (${cnt}개 담김)`:'서비스 목록'}</button>
      <button class="btn" data-go="order_select" style="flex:1.3" ${svcQ>0?'':'disabled'}>${svcQ>0?'담기 완료':'수량을 선택하세요'}</button>
    </div>`;
  }

  // STEP C — 수거신청 상세 (수거지/날짜/바우처/결제)
  function orderRequest(){
    const itemSum = cartTotal();
    const totalQ = cartCount();
    const voucherBal = S.plan==='premium'?180000:90000;
    // 세탁 품목 합계에만 바우처 자동 적용
    let washSum=0;
    Object.entries(S.cart).forEach(([si,obj])=>{
      const svc=svcList()[si];
      if(svc.type==='wash') Object.entries(obj).forEach(([ii,q])=>{ washSum += svc.items[ii].price*q; });
    });
    const useVoucher = Math.min(washSum, voucherBal);
    const finalPay = Math.max(0, itemSum - useVoucher);
    const dates = [{dd:'내일',dn:'6/9 (화)'},{dd:'모레',dn:'6/10 (수)'},{dd:'목요일',dn:'6/11 (목)'}];

    // 장바구니 품목 라인 (서비스별 그룹)
    let lines='';
    Object.entries(S.cart).forEach(([si,obj])=>{
      const svc = svcList()[si];
      const tag = svc.type==='wash'?'<span class="sc-badge wash" style="margin-left:6px">세탁</span>':'<span class="sc-badge rent" style="margin-left:6px">렌탈</span>';
      lines += `<div class="or-grp">${svc.name}${tag}</div>`;
      Object.entries(obj).forEach(([ii,q])=>{
        const it = svc.items[ii];
        lines += `<div class="or-line"><span class="olk">${it.n}</span><span class="olv">${q}개 · ${won(it.price*q)}원</span></div>`;
      });
    });

    const hasWash = cartHasWash();
    const hasRent = Object.keys(S.cart).some(si=>svcList()[si].type==='rent');
    const typeLabel = hasWash && hasRent ? '렌탈(당일) + 세탁(2~3일)' : (hasWash ? '세탁 (2~3일)' : '렌탈 (당일 출고)');

    return `
    ${statusBar(false)}
    <div class="lg-screen" style="background:var(--lg-bg-2)">
      <div class="ord-head">
        <button class="bk" data-go="order_select">‹</button>
        <span class="ot">수거신청</span>
      </div>

      <div class="or-sec">
        <div class="ost">신청 품목 · ${cartSvcCount()}종 ${totalQ}개</div>
        ${lines || '<div class="or-line"><span class="olk">담은 품목이 없습니다</span></div>'}
        <div class="or-line"><span class="olk">처리 방식</span><span class="olv">${typeLabel}</span></div>
      </div>

      <div class="or-sec">
        <div class="ost">수거 · 배송 정보</div>
        <div class="or-line"><span class="olk">사업장 주소</span><span class="olv">서울 강남구 …<span class="edit">변경</span></span></div>
        <div class="or-line"><span class="olk">수거 방법</span><span class="olv">문 앞 수거<span class="edit">변경</span></span></div>
        <div class="ost" style="margin-top:16px">수거 날짜</div>
        <div class="or-date">
          ${dates.map((d,i)=>`<button class="${S.orderDate===i?'on':''}" data-odate="${i}"><span class="dd">${d.dd}</span><span class="dn">${d.dn}</span></button>`).join('')}
        </div>
        ${hasWash?`<div class="hint-flow" style="text-align:left;padding:10px 0 0;color:var(--lg-warn)">※ 세탁 품목은 완료 후 다음 렌탈 배송 시 합포장 출고됩니다.</div>`:''}
      </div>

      <div class="or-sec">
        <div class="ost">할인 · 바우처</div>
        ${hasWash ? `<div class="or-voucher">🎟️ 세탁 바우처 자동 적용 · ${won(useVoucher)}원 (잔액 ${won(voucherBal-useVoucher)}원)</div>`
          : `<div class="or-pay-row"><span class="olk">렌탈 품목은 바우처 미적용</span><span class="olv" style="color:var(--lg-gray-2)">—</span></div>`}
      </div>

      <div class="or-sec">
        <div class="ost">결제 수단</div>
        <div class="or-line"><span class="olk">${S.payMethod==='card'?'💳 신용/체크카드':'🏦 계좌 자동이체'}</span><span class="olv"><span class="edit">변경</span></span></div>
      </div>

      <div class="or-total">
        <div class="ot-row"><span>품목 합계 (${totalQ}개)</span><span class="v">${won(itemSum)}원</span></div>
        ${useVoucher>0?`<div class="ot-row"><span>세탁 바우처</span><span class="v" style="color:var(--lg-success)">−${won(useVoucher)}원</span></div>`:''}
        <div class="ot-final"><span class="l">결제 예정 금액</span><span class="v">${won(finalPay)}원</span></div>
      </div>
      <div style="height:8px;background:var(--lg-bg-2)"></div>
    </div>
    <div class="cta-bar">
      <button class="btn blue" data-go="order_done">${won(finalPay)}원 신청하기</button>
    </div>`;
  }

  function orderDone(){
    const dates = ['6/9 (화)','6/10 (수)','6/11 (목)'];
    const hasWash = cartHasWash();
    const hasRent = Object.keys(S.cart).some(si=>svcList()[si].type==='rent');
    let svcNames = Object.keys(S.cart).map(si=>svcList()[si].name).join(', ');
    return `
    ${statusBar(false)}
    <div class="lg-screen">
      <div class="done-wrap">
        <div class="done-check">✓</div>
        <h2>수거신청이 완료됐어요!</h2>
        <p>${dates[S.orderDate]} 문 앞에서 수거합니다.<br>${hasWash&&hasRent?'렌탈은 당일 출고, 세탁은 완료 후 합포장돼요.':(hasWash?'세탁 완료 후 다음 렌탈 배송에 합포장돼요.':'클린 제품은 당일 출고됩니다.')}</p>
        <div class="done-sum">
          <div class="dr"><span class="dk">신청 서비스</span><span class="dv" style="text-align:right;max-width:200px">${cartSvcCount()}종 ${cartCount()}개</span></div>
          <div class="dr"><span class="dk">수거 예정</span><span class="dv">${dates[S.orderDate]}</span></div>
          <div class="dr"><span class="dk">결제 금액</span><span class="dv">${won(orderDoneFinal())}원</span></div>
        </div>
      </div>
    </div>
    <div class="cta-bar">
      <button class="btn" data-go="home" data-commit-order="1">홈으로 돌아가기</button>
    </div>`;
  }

  function orderDoneFinal(){
    const itemSum = cartTotal();
    const voucherBal = S.plan==='premium'?180000:90000;
    let washSum=0;
    Object.entries(S.cart).forEach(([si,obj])=>{
      const svc=svcList()[si];
      if(svc.type==='wash') Object.entries(obj).forEach(([ii,q])=>{ washSum += svc.items[ii].price*q; });
    });
    return Math.max(0, itemSum - Math.min(washSum, voucherBal));
  }

  // ---------- render ----------
  // 수거신청 확정 → 진행현황 등록
  function commitOrder(){
    const dates = ['6/9 (화)','6/10 (수)','6/11 (목)'];
    const hasWash = cartHasWash();
    const hasRent = Object.keys(S.cart).some(si=>svcList()[si].type==='rent');
    const svcNames = Object.keys(S.cart).map(si=>svcList()[si].name);
    S.activeOrders.unshift({
      date: dates[S.orderDate],
      qty: cartCount(),
      svcCount: cartSvcCount(),
      names: svcNames,
      hasWash, hasRent,
      step: 1, // 0신청 1수거예약 2수거 3세탁 4배송
    });
    S.cart = {};
    S.orderDate = 0;
  }

  // 목업 초기화
  function resetDemo(){
    S.view='home'; S.isBizMember=false;
    S.seg='stay'; S.plan='premium'; S.qty={}; S.agreeAll=false; S.payMethod='card';
    S.orderItem=0; S.cart={}; S.orderDate=0; S.activeOrders=[];
    initQty();
    render();
    const sc = root.querySelector('.lg-screen'); if(sc) sc.scrollTop=0;
  }

  function render(){
    let html='';
    switch(S.view){
      case 'home': html=home(); break;
      case 'app_my': html=appMy(); break;
      case 'wv_landing': html=wvLanding(); break;
      case 'wv_plans': html=wvPlans(); break;
      case 'ob1': html=ob1(); break;
      case 'ob2': html=ob2(); break;
      case 'ob3': html=ob3(); break;
      case 'ob4': html=ob4(); break;
      case 'ob5': html=ob5(); break;
      case 'done': html=done(); break;
      case 'order_select': html=orderSelect(); break;
      case 'order_detail': html=orderDetail(); break;
      case 'order_request': html=orderRequest(); break;
      case 'order_done': html=orderDone(); break;
    }
    root.innerHTML = `<div class="lg-phone"><div class="lg-notch"></div>${html}</div>`;
    bind();
  }

  function bind(){
    root.querySelectorAll('[data-go]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const t = el.getAttribute('data-go');
        if(el.disabled) return;
        // 가입 완료 처리
        if(el.getAttribute('data-finish')){
          S.isBizMember = true;
        }
        // 수거신청 완료 → 진행현황에 등록 후 장바구니 비우기
        if(el.getAttribute('data-commit-order')){
          commitOrder();
        }
        S.view = t;
        render();
        const sc = root.querySelector('.lg-screen'); if(sc) sc.scrollTop=0;
      });
    });
    // GNB 탭 이동 (홈/MY만 화면 존재, 나머지는 홈 유지)
    root.querySelectorAll('[data-tab]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const k = el.getAttribute('data-tab');
        if(k==='my') S.view='app_my';
        else S.view='home';
        render();
        const sc = root.querySelector('.lg-screen'); if(sc) sc.scrollTop=0;
      });
    });
    root.querySelectorAll('[data-plan]').forEach(el=>{
      el.addEventListener('click', ()=>{ S.plan=el.getAttribute('data-plan'); render(); });
    });
    root.querySelectorAll('[data-seg]').forEach(el=>{
      el.addEventListener('click', ()=>{ S.seg=el.getAttribute('data-seg'); initQty(); render(); });
    });
    root.querySelectorAll('[data-step]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [i,d] = el.getAttribute('data-step').split('|').map(Number);
        S.qty[i] = Math.max(0, (S.qty[i]??0) + d);
        render();
      });
    });
    // 수거신청: 서비스 선택 → 상세로 (cart 유지)
    root.querySelectorAll('[data-order-svc]').forEach(el=>{
      el.addEventListener('click', ()=>{
        S.orderItem = Number(el.getAttribute('data-order-svc'));
        S.view='order_detail';
        render();
        const sc = root.querySelector('.lg-screen'); if(sc) sc.scrollTop=0;
      });
    });
    // 수거신청: 상품 수량 (cart에 누적)
    root.querySelectorAll('[data-oqty]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [i,d] = el.getAttribute('data-oqty').split('|').map(Number);
        setCartQty(S.orderItem, i, cartQty(S.orderItem,i) + d);
        render();
      });
    });
    // 수거신청: 날짜 선택
    root.querySelectorAll('[data-odate]').forEach(el=>{
      el.addEventListener('click', ()=>{ S.orderDate = Number(el.getAttribute('data-odate')); render(); });
    });
    // 목업 리셋
    root.querySelectorAll('[data-reset]').forEach(el=>{
      el.addEventListener('click', ()=>{ resetDemo(); });
    });
    // 히어로 캐러셀 점 인디케이터
    const car = root.querySelector('#heroCarousel');
    const dots = root.querySelector('#heroDots');
    if(car && dots){
      car.addEventListener('scroll', ()=>{
        const idx = Math.round(car.scrollLeft / car.clientWidth);
        dots.querySelectorAll('i').forEach((d,i)=> d.classList.toggle('on', i===idx));
      }, {passive:true});
    }
    const up = root.querySelector('#upload');
    if(up) up.addEventListener('click', ()=>{ up.classList.add('done'); up.innerHTML='<span style="font-size:22px">✅</span><span>사업자등록증.jpg</span>'; });
    const aa = root.querySelector('#agreeAll');
    if(aa) aa.addEventListener('click', ()=>{ S.agreeAll=!S.agreeAll; render(); });
  }

  render();
})();
</script>
</body>
</html>
